<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18181b"><title>GadgetBoy Repair Response</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111113;color:#f4f4f5;font-family:Arial,sans-serif;padding:16px}main{width:min(100%,580px);margin:20px auto}.brand{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:3px solid #8b5cf6}.brand img{width:58px;height:58px;object-fit:contain}.brand strong{font-size:22px;color:#b56cff}.brand span{display:block;margin-top:3px;color:#a1a1aa;font-size:12px}.panel{margin-top:18px;border:1px solid #3f3f46;background:#202023;padding:22px;border-radius:8px}.eyebrow{color:#39ff14;font-size:12px;font-weight:800;text-transform:uppercase}.title{margin:9px 0;font-size:25px}.meta{color:#d4d4d8;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.button{min-height:48px;border:0;border-radius:6px;padding:12px;color:white;font-weight:800;cursor:pointer}.approve,.confirm_pickup{background:#15803d}.decline{background:#be123c}.question{background:#7e22ce}.request_pickup_change{background:#b45309}.add_information{background:#0369a1}.form{margin-top:18px}.form textarea{width:100%;min-height:120px;padding:12px;border:1px solid #52525b;border-radius:6px;background:#18181b;color:white}.submit{width:100%;margin-top:10px;background:#39ff14;color:#09090b}.message{margin-top:16px;padding:12px;border-left:4px solid #8b5cf6;background:#27272a;line-height:1.5}.error{border-left-color:#ef4444;color:#fecaca}.footer{margin-top:18px;color:#71717a;font-size:12px;text-align:center}@media(max-width:430px){main{margin-top:4px}.panel{padding:16px}.actions{grid-template-columns:1fr}}</style></head>
<body><main><header class="brand"><img src="./logo.png" alt="GadgetBoy"><div><strong>GADGETBOY</strong><span>Repair &amp; Retail | 2822 Devine Street</span></div></header><section class="panel" id="panel"><div class="message">Loading your repair update...</div></section><p class="footer">Questions? Call (803) 708-0101 or email gadgetboysc@gmail.com.</p></main>
<script>(function(){var API='https://hpuwxtfwogtsbmdvunan.supabase.co/functions/v1/client-response',panel=document.getElementById('panel'),params=new URLSearchParams(location.search),token=params.get('token')||'',requested=params.get('action')||'view';var labels={approve:'Approve Repair',decline:'Decline Repair',question:'Ask a Question',confirm_pickup:'Confirm Pickup',request_pickup_change:'Request Another Time',add_information:'Add Information'};function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function fail(m){panel.innerHTML='<div class="eyebrow">GadgetBoy Repair</div><h1 class="title">Response unavailable</h1><div class="message error">'+esc(m)+'</div>'}function showError(m){var host=document.getElementById('response-form'),e=host.querySelector('.error');if(!e){e=document.createElement('div');e.className='message error';host.appendChild(e)}e.textContent=m}function showForm(action){var needs=['question','request_pickup_change','add_information'].indexOf(action)>=0,host=document.getElementById('response-form');host.innerHTML='<div class="form">'+(needs?'<textarea id="message" maxlength="5000" placeholder="Enter your message" required></textarea>':'<div class="message">Confirm that you want to '+esc((labels[action]||action).toLowerCase())+'.</div>')+'<button class="button submit" id="submit">'+esc(labels[action]||'Send Response')+'</button></div>';document.getElementById('submit').onclick=function(){submit(action,needs?(document.getElementById('message').value||''):'')};host.scrollIntoView({behavior:'smooth',block:'nearest'})}function render(data){var actions=data.allowedActions.map(function(a){return '<button class="button '+esc(a)+'" data-action="'+esc(a)+'">'+esc(labels[a]||a)+'</button>'}).join('');panel.innerHTML='<div class="eyebrow">'+esc(data.reference)+'</div><h1 class="title">'+esc(data.device)+'</h1><div class="meta"><strong>Status:</strong> '+esc(data.status)+(data.problem?'<br><strong>Problem:</strong> '+esc(data.problem):'')+'</div><div class="actions">'+actions+'</div><div id="response-form"></div>';panel.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){showForm(b.getAttribute('data-action'))}});if(requested!=='view'&&data.allowedActions.indexOf(requested)>=0)showForm(requested)}function submit(action,message){var b=document.getElementById('submit');b.disabled=true;b.textContent='Sending...';fetch(API+'?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({action:action,message:message})}).then(function(r){return r.json().then(function(x){if(!r.ok||!x.ok)throw new Error(x.error||'Response failed.');return x})}).then(function(x){panel.innerHTML='<div class="eyebrow">Response received</div><h1 class="title">Thank you</h1><div class="message">'+esc(x.message)+'</div>'}).catch(function(e){b.disabled=false;b.textContent=labels[action]||'Send Response';showError(e.message||'Response failed.')})}if(!token){fail('This response link is incomplete.');return}fetch(API+'?token='+encodeURIComponent(token)+'&format=json&action='+encodeURIComponent(requested),{headers:{Accept:'application/json'},cache:'no-store'}).then(function(r){return r.json().then(function(x){if(!r.ok||!x.ok)throw new Error(x.error||'The repair update could not be loaded.');return x})}).then(render).catch(function(e){fail(e.message||'The repair update could not be loaded.')})})();</script></body></html>
